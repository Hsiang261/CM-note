<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫讀書筆記知識庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .tag-btn { transition: all 0.2s; }
        .tag-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .highlight { background-color: #fef08a; padding: 0 4px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="mb-8 bg-white p-6 rounded-2xl shadow-sm text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-4"><i class="fa-solid fa-book-medical text-blue-600 mr-2"></i>中醫經方筆記資料庫</h1>
            <p class="text-gray-500 mb-6">整合《打開經方這扇門》與《中醫十大類方》筆記，支援標籤篩選、關鍵字搜尋與方劑並排比較</p>
            <div class="relative w-full md:w-2/3 mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="搜尋方劑、本草（如：麻黃）、病機或症狀..." class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar: Tags -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm sticky top-4">
                    <h2 class="text-xl font-bold mb-4 flex items-center border-b pb-3"><i class="fa-solid fa-tags text-blue-500 mr-2"></i> 快速篩選標籤</h2>
                    <div id="tagsContainer" class="flex flex-wrap gap-2 max-h-[60vh] overflow-y-auto pb-4">
                        <!-- Tags injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="lg:col-span-3 space-y-8">
                
                <!-- Feature: Comparison Tool -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-blue-500">
                    <h2 class="text-2xl font-bold mb-6 flex items-center text-slate-800"><i class="fa-solid fa-scale-balanced text-blue-500 mr-3"></i> 方劑並排對照器</h2>
                    <p class="text-gray-500 mb-4 text-sm">選擇兩個方劑，比較其適用脈象、病機與不同書籍中的特徵。</p>
                    
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <select id="compare1" class="flex-1 p-3 border border-gray-200 rounded-xl text-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                        <div class="flex items-center justify-center">
                            <span class="bg-gray-200 text-gray-500 font-bold px-3 py-1 rounded-full text-sm">VS</span>
                        </div>
                        <select id="compare2" class="flex-1 p-3 border border-gray-200 rounded-xl text-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="compareResult">
                        <div id="comp1-content" class="p-6 bg-slate-50 border border-gray-100 rounded-xl min-h-[150px] shadow-inner text-gray-700 leading-relaxed"></div>
                        <div id="comp2-content" class="p-6 bg-slate-50 border border-gray-100 rounded-xl min-h-[150px] shadow-inner text-gray-700 leading-relaxed"></div>
                    </div>
                </div>

                <!-- Feature: Notes List -->
                <div class="bg-white p-6 rounded-2xl shadow-sm">
                    <h2 class="text-2xl font-bold mb-6 flex items-center text-slate-800"><i class="fa-solid fa-layer-group text-blue-500 mr-3"></i> 筆記條目 (<span id="noteCount">0</span>)</h2>
                    <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Notes injected by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const notes = [{"formula": "抵擋湯", "tags": ["瘀血", "恥骨上壓痛", "脈有力", "腹診"], "desc": "脈象：有力。\n體徵：恥骨上壓痛。\n應用：病程長多瘀血。亦治飯量大但不大便、便秘。\n注意：西醫栓塞不等於瘀血，無壓痛不可用活血劑。"}, {"formula": "大黃䗪蟲丸", "tags": ["瘀血", "恥骨上壓痛", "脈無力", "腹診", "大黃類"], "desc": "脈象：無力。\n體徵：恥骨上壓痛。\n應用：緩消癥塊，適合久病體虛之瘀血。\n補充：《十大類方》指出此方除乾血，因久瘀故形體消瘦。"}, {"formula": "桃核承氣湯", "tags": ["瘀血", "精神神志", "腹診", "大黃類"], "desc": "特徵：其人如狂。\n應用：脾氣暴躁、突然暴怒控制不住脾氣到處吵架。亦可治牙痛。\n診斷：少腹急結（左下腹、左腹股溝壓痛）。與桂枝茯苓丸壓痛類似，但有大黃證（舌紅堅老苔焦黃），精神狀況更嚴重。"}, {"formula": "小陷胸湯", "tags": ["心下壓痛", "腹診", "黃連類", "痰飲"], "desc": "體徵：心下壓痛，無「脹」感。\n病機：痰熱互結。\n應用：消化道疾病上腹脹痛、噁心泛酸、便秘、舌根黃膩（常合柴胡陷胸湯）。\n比較：半夏瀉心以痞悶為主（大便溏），本方為痞痛（大便秘、痰黏）。"}, {"formula": "大柴胡湯", "tags": ["心下壓痛", "少陽", "脹滿", "腹診", "柴胡類"], "desc": "體徵：心下壓痛且有「脹」感、心下痞硬。\n應用：膽囊息肉、胰腺炎專病專方（常加金鈴子散、鬱金等）。發熱、胸脅苦滿、嘔吐較小柴胡重，兼裏熱實證（便秘）。\n注意：用後若腹滿不減改大承氣；心理常伴郁郁微煩（抑鬱/焦慮/狂躁）。胡老常合桂枝茯苓丸。"}, {"formula": "大黃牡丹皮湯", "tags": ["右下腹壓痛", "瘀血", "急性發炎", "腹診", "大黃類"], "desc": "體徵：右下腹壓痛。\n應用：除闌尾炎，亦治閉經（右下腹壓痛者）、男婦科急性炎症。"}, {"formula": "葦莖湯", "tags": ["肺癰", "黃痰", "咳嗽"], "desc": "症狀：黃痰、膿痰、血痰，咳即胸中隱隱痛。\n應用：老年肺炎亦屬肺癰，需注意正氣。"}, {"formula": "栝樓薤白半夏湯", "tags": ["胸痹", "肺癌", "咳嗽", "痰飲"], "desc": "應用：肺癌常胸痛效佳（需重用）。亦用於帶狀疱疹常用藥組合。"}, {"formula": "小青龍湯", "tags": ["清稀痰", "表證", "咳嗽"], "desc": "症狀：清稀泡沫痰，有表證或喉嚨癢。\n應用：乾咳無痰不代表真無痰，可能卡在裡面出不來，可用此方；看到頭痛想到鼻竇炎亦可用。"}, {"formula": "苓甘五味薑辛夏仁湯", "tags": ["清稀痰", "無表證", "咳嗽"], "desc": "症狀：清稀泡沫痰。\n診斷要點：無表證，且喉嚨不癢。"}, {"formula": "小青龍加石膏湯", "tags": ["清黏痰", "煩躁", "咳嗽"], "desc": "症狀：兼喉嚨痛、晨起黃痰但之後都清稀、偶黏痰。\n病機：咳而上氣兼煩躁。"}, {"formula": "越婢加半夏湯", "tags": ["乾咳", "咳而上氣", "咳嗽"], "desc": "症狀：咳嗽時無法平躺（咳而上氣），兼眼睛憋脹。"}, {"formula": "柴胡桂枝乾薑湯", "tags": ["厥陰", "口苦", "脈無力", "女科", "皮膚疾病", "柴胡類"], "desc": "特徵：口苦，脈無力。常見於柴胡體質者經精神緊繃、勞累過後。\n腹證：胸骨處抵抗觸痛感。腹部較鬆軟（對比柴胡桂枝湯）。\n應用：滿臉粉刺脈無力者。女性類風濕最常開處方（常合當歸芍藥散）。\n要點：食慾不振為主（吃涼的難受）。大便不成形/微結。"}, {"formula": "烏梅丸", "tags": ["厥陰", "上熱下寒", "胃病"], "desc": "特徵：心煩、手熱腳冷、口渴。\n應用：厥陰病胃病燒心。烏梅要大量用。"}, {"formula": "麻黃升麻湯", "tags": ["厥陰", "虛熱"], "desc": "特徵：手足冰涼，脈無力。\n症狀：咽痛、腹瀉、唾膿血。"}, {"formula": "當歸四逆湯", "tags": ["厥陰", "虛寒", "手足冰涼", "桂枝類"], "desc": "特徵：手足冰涼，脈細無力（脈細為血管收縮，非心臟衰弱）。\n應用：厥陰病咳嗽、類風濕。血虛肝寒頭痛（加吳茱萸生薑）。"}, {"formula": "白虎湯", "tags": ["陽明", "裏熱", "盜汗", "白虎類"], "desc": "特徵：陽明病時間（申酉戌），脈有力。舌乾燥無津。\n應用：盜汗；面部紅色粉刺；惡熱多汗煩渴之目疾、皮炎、口腔炎。"}, {"formula": "大承氣湯", "tags": ["陽明", "磨牙", "痙病", "大黃類"], "desc": "特徵：大便硬，脈有力。大黃體質（舌紅堅老苔焦黃）。\n應用：裏實精神病、腸麻痹（術後/腸梗阻）、急性感染（肺炎/腦炎）。僵直性脊椎炎伴虹膜炎。有時大便不乾也屬痙病大承氣證。"}, {"formula": "桂枝湯", "tags": ["桂枝類", "體質", "皮膚疾病"], "desc": "體質：文弱書生，白皮舌黯淡，質地柔嫩潤澤（表虛），易出汗、心腹悸動、拘急疼痛。需與伏熱（唇紅）鑑別。\n應用：發熱或自覺發熱。亦用於皮膚病、過敏性鼻炎（黃煌加五味子細辛附子，或蟬蛻）、妊娠惡阻。"}, {"formula": "小建中湯", "tags": ["桂枝類", "腹痛"], "desc": "組成：桂枝加芍藥再加飴糖。\n應用：慢性虛弱性腹痛。不宜甜食或急性嚴重腹痛者改用桂枝加芍藥湯。"}, {"formula": "桂枝加芍藥湯", "tags": ["桂枝類", "腹痛", "便秘"], "desc": "應用：裏實漸顯之腹痛；習慣性便秘。病情較小建中湯急。"}, {"formula": "桂枝加大黃湯", "tags": ["桂枝類", "腹痛", "大黃類"], "desc": "應用：持續性腹痛，拒按便秘，裏實明顯。"}, {"formula": "桂枝加龍骨牡蠣湯", "tags": ["桂枝類", "精神神志", "虛證"], "desc": "特徵：脈必見浮大無力，舌嫩紅苔薄白。確認為正虛無邪。\n比較：對比柴龍牡，本方僅為不眠、多夢（精神狀況較輕）。"}, {"formula": "溫經湯", "tags": ["桂枝類", "厥陰", "女科"], "desc": "症狀：自覺手足心熱而惡風、自汗，午後發熱感、頭痛噁心（看似熱證實有寒）。\n歸類：打開經方歸於厥陰病，吳茱萸桂枝散寒。"}, {"formula": "炙甘草湯", "tags": ["桂枝類", "心血管"], "desc": "應用：桂枝體質的心臟病（面容憔悴消瘦）。陰虛證心律失常代表方；癌症化療後。方證有便秘。"}, {"formula": "苓桂朮甘湯", "tags": ["桂枝類", "痰飲", "眩暈"], "desc": "應用：常出現於眩暈。發病急，常因精神刺激誘發。\n比較：苓桂棗甘湯（動悸沖逆最適合）；五苓散（利水作用更大）。"}, {"formula": "桂枝茯苓丸", "tags": ["桂枝類", "瘀血", "腹診"], "desc": "特徵：下腹複診不適感。伴面暗紅。\n應用：有精神狀況（如桃核承氣）。不限婦科，冠心病、糖尿病、痤瘡、銀屑病、腰椎等皆可用。"}, {"formula": "枳實薤白桂枝湯", "tags": ["桂枝類", "胸痹"], "desc": "特徵：桂枝類方的理氣方。典型桂枝舌（需與承氣/理中鑑別）。輕症為桂枝生薑枳實湯。"}, {"formula": "桂枝芍藥知母湯", "tags": ["桂枝類", "關節痛", "水腫"], "desc": "組成：桂枝加附子合麻黃加朮加防風知母。\n特徵：程度比桂枝加附子重，因有白朮麻黃，方證有腳腫。"}, {"formula": "麻黃湯", "tags": ["麻黃類", "體質", "咳嗽"], "desc": "體質：壯實、肌肉彈性、唇暗紫紅、閉汗、浮腫傾向。\n特徵：惡寒發熱併見（加衣不解），無汗而喘。\n加減：喘咳加厚朴半夏；熱證併連翹黃芩。麻黃加朮湯（浮腫明顯大便不成形）。"}, {"formula": "麻黃附子細辛湯", "tags": ["麻黃類", "附子類", "疼痛"], "desc": "應用：治冷痺（黃煌常合芍藥甘草治坐骨神經痛）。整個背部畏寒者。陽和湯之陽虛基礎。"}, {"formula": "麻杏石甘湯", "tags": ["麻黃類", "咳嗽", "皮膚疾病"], "desc": "特徵：「汗出」而喘（微微汗），舌較乾。對無發熱者亦有效。\n應用：支氣管炎（合小陷胸）、皮膚病（濕疹/尋麻疹/痤瘡）。"}, {"formula": "越婢加朮湯", "tags": ["麻黃類", "水腫"], "desc": "組成：麻杏石甘去杏加朮棗薑甘（去杏不用於喘咳）。\n比較：對比麻黃加朮，本方用於熱證，石膏制麻黃。常用於急性腎炎浮腫。"}, {"formula": "陽和湯", "tags": ["麻黃類", "陰寒"], "desc": "思路：麻黃湯證兼陰陽兩虛。\n應用：陰寒性疾病（雷諾氏、末梢神經炎）、陰疽（骨結核、風濕關節炎、椎間盤突出）。"}, {"formula": "小柴胡湯", "tags": ["柴胡類", "體質", "發熱"], "desc": "體質：偏瘦、面暗黃、情緒波動大、肌肉堅緊。\n特徵：胸脅苦滿（主觀或腹診抵抗感）、往來寒熱（主觀或客觀高低熱）、休作有時（定時發作）。心煩喜嘔，主觀症狀多。\n應用：水腫合五苓散（柴苓湯）；發熱性感染。"}, {"formula": "柴胡桂枝湯", "tags": ["柴胡類", "桂枝類", "腹診"], "desc": "特徵：兩方證併見，舌偏暗。腹部較緊張（對比柴胡桂枝乾薑湯）。\n應用：癲癇見胸脅苦滿與腹直肌拘攣。"}, {"formula": "柴胡加龍骨牡蠣湯", "tags": ["柴胡類", "精神神志", "腹診"], "desc": "特徵：臍腹動悸（甚可摸到主動脈）。舌苔黃膩乾焦，多腹滿便秘。檢查無器質病變。\n比較：比桂龍牡精神狀況更嚴重。焦慮腹脹加梔子厚朴。"}, {"formula": "四逆散", "tags": ["柴胡類", "神經性疾病"], "desc": "特徵：腹痛按了加重。手足冷（但脈有力，與四逆湯不同）。\n應用：頑固神經病（頭痛失眠嘔吐）用血府逐瘀湯。"}, {"formula": "血府逐瘀湯", "tags": ["柴胡類", "瘀血", "精神神志"], "desc": "應用：頑固性呃逆（舌暗脈弦）、頑固失眠癲癇。不一定有明顯血瘀（余秋平認作少陽氣血分瘀兼血熱）。"}, {"formula": "逍遙散", "tags": ["柴胡類", "女科"], "desc": "組成視角：當歸芍藥散 合 四逆散。"}, {"formula": "防風通聖散", "tags": ["大黃類", "皮膚疾病", "代謝"], "desc": "作用：開通孔竅使熱毒外出，兼養血活血。\n應用：單純性肥胖、高血脂、高血壓。"}, {"formula": "玉屏風散", "tags": ["黃耆類", "體質", "汗證"], "desc": "體質：浮腫鬆軟，自汗嚴重，能大量進食不耐飢。\n特徵：水濕內蘊症狀多（對比桂枝湯之痙攣痛）。\n應用：常為基礎方，加辛夷蟬蛻等治過敏性鼻炎。"}, {"formula": "防己黃耆湯", "tags": ["黃耆類", "水腫", "關節痛"], "desc": "特徵：腰以下浮腫、關節痛，反覆發作。\n比較：越婢加朮為全身性、有熱象且病程短。本方亦用於減肥。"}, {"formula": "黃耆桂枝五物湯", "tags": ["黃耆類", "桂枝類", "神經病變"], "desc": "特徵：汗出、身體重。去甘草（身腫不可用甘草），重用生薑。中老年動則喘、疲乏。\n應用：身體不仁、肢體酸麻為主（可加活血藥）。治瘡口不癒合玉屏風。"}, {"formula": "黃耆建中湯", "tags": ["黃耆類", "腹痛"], "desc": "特徵：重用芍藥緩急。\n應用：慢性腹痛，十二指腸潰瘍專方、慢性胃炎。"}, {"formula": "補中益氣湯", "tags": ["黃耆類", "柴胡類"], "desc": "特徵：脾胃內傷始得之證，體弱。為黃耆+柴胡證結合。\n比較：柴胡桂枝湯多桂枝證；本方黃耆證明顯，體力低下且慢性化。五官科疾病可用。"}, {"formula": "補陽還五湯", "tags": ["黃耆類", "瘀血"], "desc": "比較：瘀血比黃耆桂枝五物重。對比桂枝茯苓（少腹痛/面暗紅）與血府（胸悶情緒），本方多肢體運動知覺異常伴自汗浮腫。"}, {"formula": "白虎加參湯", "tags": ["白虎類"], "desc": "應用：無大熱大汗，但以渴飲為主的慢性病。"}, {"formula": "黃連解毒湯", "tags": ["黃連類", "清熱"], "desc": "體質：煩躁不安，心下痞，舌紅堅老苔黃膩乾。\n應用：急性感染熱入血分/濕熱。合四物為溫清飲（兼出血不調）。加味治頭面熱毒。"}, {"formula": "黃連湯", "tags": ["黃連類", "桂枝類", "乾薑類"], "desc": "特徵：黃連+桂枝+乾薑。汗出熱不退/煩躁（黃連）+惡風心悸氣衝（桂枝）。\n腹證：以腹痛為主，寒證多         allTags.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'tag-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium border border-gray-200 hover:bg-gray-50';
            btn.innerHTML = `<i class="fa-solid fa-hashtag text-gray-400 mr-1 text-xs"></i>${tag}`;
            btn.onclick = () => {
                if (activeTags.has(tag)) {
                    activeTags.delete(tag);
                    btn.classList.remove('active');
                    btn.querySelector('i').classList.remove('text-blue-200');
                    btn.querySelector('i').classList.add('text-gray-400');
                } else {
                    activeTags.add(tag);
                    btn.classList.add('active');
                    btn.querySelector('i').classList.remove('text-gray-400');
                    btn.querySelector('i').classList.add('text-blue-200');
                }
                renderNotes();
            };
            tagsContainer.appendChild(btn);
        });

        // Search highlight helper
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Render Notes List
        function renderNotes() {
            const query = searchInput.value.toLowerCase().trim();
            notesContainer.innerHTML = '';
            
            const filteredNotes = notes.filter(n => {
                const matchTags = activeTags.size === 0 || [...activeTags].every(t => n.tags.includes(t));
                const matchQuery = !query || 
                    n.formula.toLowerCase().includes(query) || 
                    n.desc.toLowerCase().includes(query) || 
                    n.tags.join(' ').toLowerCase().includes(query);
                return matchTags && matchQuery;
            });

            noteCount.innerText = filteredNotes.length;

            if(filteredNotes.length === 0) {
                notesContainer.innerHTML = `<div class="col-span-1 md:col-span-2 text-center py-8 text-gray-400"><i class="fa-solid fa-inbox text-4xl mb-3"></i><p>沒有符合條件的筆記</p></div>`;
                return;
            }

            filteredNotes.forEach(n => {
                const el = document.createElement('div');
                el.className = 'p-5 border border-gray-100 rounded-xl hover:shadow-md transition-shadow bg-slate-50 flex flex-col h-full';
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-xl font-bold text-blue-900">${highlightText(n.formula, query)}</h3>
                    </div>
                    <div class="flex gap-1 flex-wrap mb-3">
                        ${n.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded shadow-sm">#${t}</span>`).join('')}
                    </div>
                    <p class="text-gray-700 text-sm whitespace-pre-wrap flex-grow leading-relaxed">${highlightText(n.desc, query)}</p>
                `;
                notesContainer.appendChild(el);
            });
        }

        // Setup Comparison Logic
        const sortedFormulas = [...notes].sort((a, b) => a.formula.localeCompare(b.formula));
        sortedFormulas.forEach(n => {
            comp1.add(new Option(n.formula, n.formula));
            comp2.add(new Option(n.formula, n.formula));
        });
        
        comp1.value = "桂枝加龍骨牡蠣湯";
        comp2.value = "柴胡加龍骨牡蠣湯";

        function updateCompare() {
            const f1 = notes.find(n => n.formula === comp1.value);
            const f2 = notes.find(n => n.formula === comp2.value);
            
            let desc1 = f1 ? f1.desc : '';
            let desc2 = f2 ? f2.desc : '';
            
            const diffKeywords = ['有力', '無力', '脹滿', '無脹感', '表證', '無表證', '腹滿', '便秘', '自汗', '無汗'];
            diffKeywords.forEach(kw => {
                if (desc1.includes(kw) && !desc2.includes(kw)) {
                    desc1 = desc1.replace(new RegExp(kw, 'g'), `<span class="bg-red-100 text-red-800 font-bold px-1 rounded">${kw}</span>`);
                }
                if (desc2.includes(kw) && !desc1.includes(kw)) {
                    desc2 = desc2.replace(new RegExp(kw, 'g'), `<span class="bg-red-100 text-red-800 font-bold px-1 rounded">${kw}</span>`);
                }
            });

            if (f1) {
                comp1Content.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                        <div class="font-bold text-2xl text-blue-900">${f1.formula}</div>
                    </div>
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${f1.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">#${t}</span>`).join('')}
                    </div>
                    <div class="whitespace-pre-wrap text-sm">${desc1}</div>
                `;
            }
            if (f2) {
                comp2Content.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                        <div class="font-bold text-2xl text-blue-900">${f2.formula}</div>
                    </div>
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${f2.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">#${t}</span>`).join('')}
                    </div>
                    <div class="whitespace-pre-wrap text-sm">${desc2}</div>
                `;
            }
        }

        comp1.addEventListener('change', updateCompare);
        comp2.addEventListener('change', updateCompare);
        searchInput.addEventListener('input', renderNotes);

        renderNotes();
        updateCompare();
    </script>
</body>
</html>
