<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫讀書筆記知識庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        .tag-btn { transition: all 0.2s; }
        .tag-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }
        .highlight { background-color: #fef08a; padding: 0 4px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="mb-8 bg-white p-6 rounded-2xl shadow-sm text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-4"><i class="fa-solid fa-book-medical text-blue-600 mr-2"></i>中醫經方筆記資料庫</h1>
            <p class="text-gray-500 mb-6">整合《打開經方這扇門》筆記，支援標籤篩選、關鍵字搜尋與方劑並排比較</p>
            <div class="relative w-full md:w-2/3 mx-auto">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="搜尋方劑、本草（如：麻黃）、病機或症狀..." class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <!-- Sidebar: Tags -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm sticky top-4">
                    <h2 class="text-xl font-bold mb-4 flex items-center border-b pb-3"><i class="fa-solid fa-tags text-blue-500 mr-2"></i> 快速篩選標籤</h2>
                    <div id="tagsContainer" class="flex flex-wrap gap-2">
                        <!-- Tags injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="lg:col-span-3 space-y-8">
                
                <!-- Feature: Comparison Tool -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-blue-500">
                    <h2 class="text-2xl font-bold mb-6 flex items-center text-slate-800"><i class="fa-solid fa-scale-balanced text-blue-500 mr-3"></i> 方劑並排對照器</h2>
                    <p class="text-gray-500 mb-4 text-sm">選擇兩個方劑，比較其適用脈象、病機與特徵。</p>
                    
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <select id="compare1" class="flex-1 p-3 border border-gray-200 rounded-xl text-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                        <div class="flex items-center justify-center">
                            <span class="bg-gray-200 text-gray-500 font-bold px-3 py-1 rounded-full text-sm">VS</span>
                        </div>
                        <select id="compare2" class="flex-1 p-3 border border-gray-200 rounded-xl text-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none"></select>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="compareResult">
                        <div id="comp1-content" class="p-6 bg-slate-50 border border-gray-100 rounded-xl min-h-[150px] shadow-inner text-gray-700 leading-relaxed"></div>
                        <div id="comp2-content" class="p-6 bg-slate-50 border border-gray-100 rounded-xl min-h-[150px] shadow-inner text-gray-700 leading-relaxed"></div>
                    </div>
                </div>

                <!-- Feature: Notes List -->
                <div class="bg-white p-6 rounded-2xl shadow-sm">
                    <h2 class="text-2xl font-bold mb-6 flex items-center text-slate-800"><i class="fa-solid fa-layer-group text-blue-500 mr-3"></i> 筆記條目 (<span id="noteCount">0</span>)</h2>
                    <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Notes injected by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Database from TCM Notes
        const notes = [
            { formula: "抵擋湯", tags: ["瘀血", "恥骨上壓痛", "脈有力", "腹診"], desc: "脈象：有力。
體徵：恥骨上壓痛。
應用：病程長多瘀血。亦治飯量大但不大便、便秘。
注意：西醫栓塞不等於瘀血，無壓痛不可用活血劑。" },
            { formula: "大黃䗪蟲丸", tags: ["瘀血", "恥骨上壓痛", "脈無力", "腹診"], desc: "脈象：無力。
體徵：恥骨上壓痛。
應用：緩消癥塊，適合久病體虛之瘀血。" },
            { formula: "桃核承氣湯", tags: ["瘀血", "精神神志", "腹診"], desc: "特徵：其人如狂。
應用：脾氣暴躁、突然暴怒控制不住脾氣到處吵架。亦可治牙痛。
診斷：複診常有壓痛。" },
            { formula: "小陷胸湯", tags: ["心下壓痛", "腹診"], desc: "體徵：心下壓痛，無「脹」感。
病機：痰熱互結。" },
            { formula: "大柴胡湯", tags: ["心下壓痛", "少陽", "脹滿", "腹診"], desc: "體徵：心下壓痛且有「脹」感。
應用：膽囊息肉可用大柴胡加烏梅、僵蠶、威靈仙。
注意：用後若腹滿不減，改用大承氣湯。" },
            { formula: "大黃牡丹皮湯", tags: ["右下腹壓痛", "瘀血", "急性發炎", "腹診"], desc: "體徵：右下腹壓痛。
應用：除闌尾炎，亦治閉經（右下腹壓痛者）、男婦科急性炎症。" },
            { formula: "葦莖湯", tags: ["肺癰", "黃痰", "咳嗽"], desc: "症狀：黃痰、膿痰、血痰，咳即胸中隱隱痛。
應用：老年肺炎亦屬肺癰，需注意正氣。" },
            { formula: "栝樓薤白半夏湯", tags: ["胸痹", "肺癌", "咳嗽"], desc: "應用：肺癌常胸痛效佳（需重用）。亦用於帶狀疱疹常用藥組合。" },
            { formula: "小青龍湯", tags: ["清稀痰", "表證", "咳嗽"], desc: "症狀：清稀泡沫痰，有表證或喉嚨癢。
應用：乾咳無痰不代表真無痰，可能卡在裡面出不來，可用此方；看到頭痛想到鼻竇炎亦可用。" },
            { formula: "苓甘五味薑辛夏仁湯", tags: ["清稀痰", "無表證", "咳嗽"], desc: "症狀：清稀泡沫痰。
診斷要點：無表證，且喉嚨不癢。" },
            { formula: "小青龍加石膏湯", tags: ["清黏痰", "煩躁", "咳嗽"], desc: "症狀：兼喉嚨痛、晨起黃痰但之後都清稀、偶黏痰。
病機：咳而上氣兼煩躁。" },
            { formula: "越婢加半夏湯", tags: ["乾咳", "咳而上氣", "咳嗽"], desc: "症狀：咳嗽時無法平躺（咳而上氣），兼眼睛憋脹。" },
            { formula: "柴胡桂枝乾薑湯", tags: ["厥陰", "口苦", "脈無力", "女科", "皮膚疾病"], desc: "特徵：口苦，脈無力。
應用：滿臉粉刺脈無力者。女性類風濕最常開處方（常合當歸芍藥散）。
要點：此方證與大便乾稀無關，關鍵是「吃涼的難受」。" },
            { formula: "烏梅丸", tags: ["厥陰", "上熱下寒", "胃病"], desc: "特徵：心煩、手熱腳冷、口渴。
應用：厥陰病胃病燒心。烏梅要大量用。" },
            { formula: "麻黃升麻湯", tags: ["厥陰", "虛熱"], desc: "特徵：手足冰涼，脈無力。
症狀：咽痛、腹瀉、唾膿血。" },
            { formula: "當歸四逆加吳茱萸生薑湯", tags: ["厥陰", "虛寒", "手足冰涼", "咳嗽"], desc: "特徵：手足冰涼，脈細無力。
應用：厥陰病咳嗽，或排除口苦/上熱下寒/咽痛腹瀉以外的類風濕厥陰證。" },
            { formula: "白虎湯", tags: ["陽明", "裏熱", "盜汗"], desc: "特徵：陽明病時間（申酉戌），脈有力。
應用：經方看盜汗可能為陽明裏熱；面部紅色粉刺亦可先考慮陽明病。" },
            { formula: "大承氣湯", tags: ["陽明", "磨牙", "痙病"], desc: "特徵：大便硬，脈有力。
應用：陽明病導致磨牙。僵直性脊椎炎伴面赤目赤(虹膜炎)可用。有時大便不乾也可為痙病大承氣證。" },
            { formula: "葛根湯", tags: ["太陽", "背部疾病", "痙病", "皮膚疾病"], desc: "應用：背部粉刺首選；腰椎間盤突出、僵直性脊椎炎皆可先想此方。下巴粉刺屬腎(非此方)；口吃(口噤)、打鼾寒證皆可用。" }
        ];

        // Extracted unique tags
        const allTags = [...new Set(notes.flatMap(n => n.tags))].sort();
        let activeTags = new Set();

        const tagsContainer = document.getElementById('tagsContainer');
        const notesContainer = document.getElementById('notesContainer');
        const searchInput = document.getElementById('searchInput');
        const comp1 = document.getElementById('compare1');
        const comp2 = document.getElementById('compare2');
        const comp1Content = document.getElementById('comp1-content');
        const comp2Content = document.getElementById('comp2-content');
        const noteCount = document.getElementById('noteCount');

        // Render Tags
        allTags.forEach(tag => {
            const btn = document.createElement('button');
            btn.className = 'tag-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-medium border border-gray-200 hover:bg-gray-50';
            btn.innerHTML = `<i class="fa-solid fa-hashtag text-gray-400 mr-1 text-xs"></i>${tag}`;
            btn.onclick = () => {
                if (activeTags.has(tag)) {
                    activeTags.delete(tag);
                    btn.classList.remove('active');
                    btn.querySelector('i').classList.remove('text-blue-200');
                    btn.querySelector('i').classList.add('text-gray-400');
                } else {
                    activeTags.add(tag);
                    btn.classList.add('active');
                    btn.querySelector('i').classList.remove('text-gray-400');
                    btn.querySelector('i').classList.add('text-blue-200');
                }
                renderNotes();
            };
            tagsContainer.appendChild(btn);
        });

        // Search highlight helper
        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Render Notes List
        function renderNotes() {
            const query = searchInput.value.toLowerCase().trim();
            notesContainer.innerHTML = '';
            
            const filteredNotes = notes.filter(n => {
                const matchTags = activeTags.size === 0 || [...activeTags].every(t => n.tags.includes(t));
                const matchQuery = !query || 
                    n.formula.toLowerCase().includes(query) || 
                    n.desc.toLowerCase().includes(query) || 
                    n.tags.join(' ').toLowerCase().includes(query);
                return matchTags && matchQuery;
            });

            noteCount.innerText = filteredNotes.length;

            if(filteredNotes.length === 0) {
                notesContainer.innerHTML = `<div class="col-span-1 md:col-span-2 text-center py-8 text-gray-400"><i class="fa-solid fa-inbox text-4xl mb-3"></i><p>沒有符合條件的筆記</p></div>`;
                return;
            }

            filteredNotes.forEach(n => {
                const el = document.createElement('div');
                el.className = 'p-5 border border-gray-100 rounded-xl hover:shadow-md transition-shadow bg-slate-50 flex flex-col h-full';
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="text-xl font-bold text-blue-900">${highlightText(n.formula, query)}</h3>
                    </div>
                    <div class="flex gap-1 flex-wrap mb-3">
                        ${n.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded shadow-sm">#${t}</span>`).join('')}
                    </div>
                    <p class="text-gray-700 text-sm whitespace-pre-wrap flex-grow leading-relaxed">${highlightText(n.desc, query)}</p>
                `;
                notesContainer.appendChild(el);
            });
        }

        // Setup Comparison Logic
        const sortedFormulas = [...notes].sort((a, b) => a.formula.localeCompare(b.formula));
        sortedFormulas.forEach(n => {
            comp1.add(new Option(n.formula, n.formula));
            comp2.add(new Option(n.formula, n.formula));
        });
        
        // Default selected for demo
        comp1.value = "抵擋湯";
        comp2.value = "大黃䗪蟲丸";

        function updateCompare() {
            const f1 = notes.find(n => n.formula === comp1.value);
            const f2 = notes.find(n => n.formula === comp2.value);
            
            // Simple logic to highlight differences in description (e.g. 有力 vs 無力)
            let desc1 = f1 ? f1.desc : '';
            let desc2 = f2 ? f2.desc : '';
            
            // basic keyword highlighting for common differences in TCM
            const diffKeywords = ['有力', '無力', '脹滿', '無脹感', '寒', '熱', '虛', '實', '陰', '陽', '有表證', '無表證', '吃涼的難受'];
            diffKeywords.forEach(kw => {
                if (desc1.includes(kw) && !desc2.includes(kw)) {
                    desc1 = desc1.replace(new RegExp(kw, 'g'), `<span class="bg-red-100 text-red-800 font-bold px-1 rounded">${kw}</span>`);
                }
                if (desc2.includes(kw) && !desc1.includes(kw)) {
                    desc2 = desc2.replace(new RegExp(kw, 'g'), `<span class="bg-red-100 text-red-800 font-bold px-1 rounded">${kw}</span>`);
                }
            });

            if (f1) {
                comp1Content.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                        <div class="font-bold text-2xl text-blue-900">${f1.formula}</div>
                    </div>
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${f1.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">#${t}</span>`).join('')}
                    </div>
                    <div class="whitespace-pre-wrap text-sm">${desc1}</div>
                `;
            }
            if (f2) {
                comp2Content.innerHTML = `
                    <div class="flex items-center justify-between mb-3 border-b border-gray-200 pb-2">
                        <div class="font-bold text-2xl text-blue-900">${f2.formula}</div>
                    </div>
                    <div class="flex flex-wrap gap-1 mb-4">
                        ${f2.tags.map(t => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">#${t}</span>`).join('')}
                    </div>
                    <div class="whitespace-pre-wrap text-sm">${desc2}</div>
                `;
            }
        }

        // Event Listeners
        comp1.addEventListener('change', updateCompare);
        comp2.addEventListener('change', updateCompare);
        searchInput.addEventListener('input', renderNotes);

        // Initialize
        renderNotes();
        updateCompare();
    </script>
</body>
</html>
